# Po každom push do main zverejní web na GitHub Pages (https://<účet>.github.io/<repozitár>/).
# simulator.html sa zašifruje heslom zo Secret ADREMA_ACCESS_PASSWORD a vloží sa doň config.js z GitHub Secrets VAPI_PUBLIC_KEY a ELEVENLABS_VOICE_ID (voliteľne GROQ_API_KEY, VAPI_LLM_MODEL, ELEVENLABS_MODEL).
name: Nasadenie na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stiahnuť kód
        uses: actions/checkout@v4

      - name: Pripraviť web a config.js zo Secrets
        env:
          SKIP_HTACCESS: '1'
          ADREMA_ACCESS_PASSWORD: ${{ secrets.ADREMA_ACCESS_PASSWORD }}
          VAPI_PUBLIC_KEY: ${{ secrets.VAPI_PUBLIC_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_VOICE_ID_FEMALE: ${{ secrets.ELEVENLABS_VOICE_ID_FEMALE }}
          ELEVENLABS_VOICE_ID_MALE: ${{ secrets.ELEVENLABS_VOICE_ID_MALE }}
          CALLER_VOICES: ${{ secrets.CALLER_VOICES }}
          VAPI_LLM_MODEL: ${{ secrets.VAPI_LLM_MODEL }}
          ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/build-site.mjs

      - name: Nastaviť GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrať web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Zverejniť
        id: deployment
        uses: actions/deploy-pages@v4
